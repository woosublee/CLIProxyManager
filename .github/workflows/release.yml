name: Notarized Release

# Builds the official auto-update release entirely in CI, signed with the
# Developer ID certificate, notarized and stapled by Apple, and verified by
# Sparkle EdDSA signatures. Releases up to 0.1.44 were signed with the
# self-signed "cliproxymanager" certificate. Sparkle still accepts the update
# because the EdDSA key in Info.plist is unchanged, which allows the Apple code
# signing identity to rotate.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cliproxymanager-official-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish notarized release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve and validate release identity
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/resolve-release-version.sh validate
          scripts/sync-release-version.sh --check
          eval "$(scripts/resolve-release-version.sh shell)"
          ACTUAL_TAG='invalid'
          if [[ "$INPUT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            ACTUAL_TAG="$INPUT_TAG"
          fi

          if [ "$INPUT_TAG" != "$RELEASE_TAG" ]; then
            echo "Workflow tag mismatch: expected $RELEASE_TAG, actual $ACTUAL_TAG" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists on origin." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to query release tag $RELEASE_TAG." >&2
              exit "$status"
            fi
          fi

          scripts/check-release-monotonic.sh \
            --repository "$GITHUB_REPOSITORY" \
            --provenance build/release-provenance.json

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$RELEASE_BUILD" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$RELEASE_DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "appcast_path=$RELEASE_APPCAST_PATH" >> "$GITHUB_OUTPUT"
          echo "provenance_path=build/release-provenance.json" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          bash scripts/run-script-tests.sh
          swift test

      - name: Restore pinned CLIProxyAPI artifact cache
        uses: actions/cache@v4
        with:
          path: .build/cliproxyapi
          key: cliproxyapi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Sources/CLIProxyManagerApp/Resources/cliproxyapi/cliproxyapi.manifest.json') }}

      - name: Resolve pinned CLIProxyAPI artifact
        run: make resolve-bundled-proxy

      # Required GitHub secrets:
      #   DEVELOPER_ID_CERTIFICATE_BASE64 — base64-encoded .p12 with the Developer ID Application identity (and optionally Apple's G2 intermediate)
      #   DEVELOPER_ID_CERTIFICATE_PASSWORD — password for the .p12
      #   ASC_KEY_ID — App Store Connect API key ID for notarization
      #   ASC_ISSUER_ID — App Store Connect API issuer ID
      #   ASC_KEY_P8_BASE64 — base64-encoded App Store Connect API private key (.p8)
      #   SPARKLE_PRIVATE_KEY — Sparkle EdDSA private key for appcast signing
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "DEVELOPER_ID_CERTIFICATE_BASE64 secret is required." >&2
            exit 1
          fi

          if [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "DEVELOPER_ID_CERTIFICATE_PASSWORD secret is required." >&2
            exit 1
          fi

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          # Make sure Apple's Developer ID G2 intermediate is in this keychain so
          # the identity is valid without relying on the runner image. The .p12
          # may already carry it; otherwise download, verify, and import it.
          import_intermediate() {
            local name="$1" expected_sha256="$2"
            local path="$RUNNER_TEMP/$name.cer"
            if security find-certificate -a -Z "$KEYCHAIN_PATH" | grep -qi "SHA-256 hash: $expected_sha256"; then
              echo "$name is already in the signing keychain."
              return
            fi
            curl -fsSL --retry 3 -o "$path" "https://www.apple.com/certificateauthority/$name.cer"
            echo "$expected_sha256  $path" | shasum -a 256 -c -
            security import "$path" -k "$KEYCHAIN_PATH"
            rm -f "$path"
          }
          import_intermediate DeveloperIDG2CA f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required." >&2
              exit 1
            fi
          done
          KEY_PATH="$RUNNER_TEMP/notary_api_key.p8"
          (umask 077 && echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH")
          xcrun notarytool store-credentials "notarytool-profile" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: Build, sign, notarize, and verify DMG
        run: CLIPROXYAPI_OFFLINE=1 make CODESIGN_IDENTITY="$CODESIGN_IDENTITY" NOTARY_PROFILE=notarytool-profile NOTARY_KEYCHAIN="$KEYCHAIN_PATH" verify-dmg

      - name: Sign DMG
        run: make CODESIGN_IDENTITY="$CODESIGN_IDENTITY" sign-dmg

      - name: Notarize DMG
        run: make NOTARY_PROFILE=notarytool-profile NOTARY_KEYCHAIN="$KEYCHAIN_PATH" notarize-dmg

      - name: Generate Sparkle appcast
        env:
          REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/generate-sparkle-appcast.sh

      - name: Verify release artifacts
        run: |
          scripts/verify-release-artifacts.sh \
            --source-plist Info.plist \
            --app build/CLIProxyManager.app \
            --dmg "${{ steps.version.outputs.dmg_path }}" \
            --appcast "${{ steps.version.outputs.appcast_path }}" \
            --provenance "${{ steps.version.outputs.provenance_path }}" \
            --official

      - name: Recheck published build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/check-release-monotonic.sh \
            --repository "$GITHUB_REPOSITORY" \
            --provenance "${{ steps.version.outputs.provenance_path }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release tag ${{ steps.version.outputs.tag }} appeared while artifacts were building." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to recheck release tag ${{ steps.version.outputs.tag }}." >&2
              exit "$status"
            fi
          fi

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CLIProxyManager ${{ steps.version.outputs.version }}
          body: |
            Developer ID signed and notarized DMG with Sparkle appcast.

            Updating from CLIProxyManager 0.1.44 or earlier works through the in-app updater as before, even though those builds used a self-signed certificate.
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.version.outputs.dmg_path }}
            ${{ steps.version.outputs.appcast_path }}
            ${{ steps.version.outputs.provenance_path }}

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/notary_api_key.p8"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
