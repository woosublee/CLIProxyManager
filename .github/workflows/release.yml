name: Self-signed Release

# Builds the official auto-update release entirely in CI, signed with the
# self-signed "cliproxymanager" certificate (the same identity used for local
# releases). This removes the dependency on a specific release Mac while keeping
# today's self-signed Sparkle update path. New users may still see a first-launch
# Gatekeeper warning because this build is not Developer ID signed or notarized.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cliproxymanager-official-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish self-signed release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve and validate release identity
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/resolve-release-version.sh validate
          scripts/sync-release-version.sh --check
          eval "$(scripts/resolve-release-version.sh shell)"
          ACTUAL_TAG='invalid'
          if [[ "$INPUT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            ACTUAL_TAG="$INPUT_TAG"
          fi

          if [ "$INPUT_TAG" != "$RELEASE_TAG" ]; then
            echo "Workflow tag mismatch: expected $RELEASE_TAG, actual $ACTUAL_TAG" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists on origin." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to query release tag $RELEASE_TAG." >&2
              exit "$status"
            fi
          fi

          scripts/check-release-monotonic.sh \
            --repository "$GITHUB_REPOSITORY" \
            --provenance build/release-provenance.json

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$RELEASE_BUILD" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$RELEASE_DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "appcast_path=$RELEASE_APPCAST_PATH" >> "$GITHUB_OUTPUT"
          echo "provenance_path=build/release-provenance.json" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          bash scripts/run-script-tests.sh
          swift test

      - name: Restore pinned CLIProxyAPI artifact cache
        uses: actions/cache@v4
        with:
          path: .build/cliproxyapi
          key: cliproxyapi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Sources/CLIProxyManagerApp/Resources/cliproxyapi/cliproxyapi.manifest.json') }}

      - name: Resolve pinned CLIProxyAPI artifact
        run: make resolve-bundled-proxy

      # Required GitHub secrets:
      #   CLIPROXYMANAGER_CERTIFICATE_BASE64 — base64-encoded .p12 of the self-signed "cliproxymanager" certificate (with private key)
      #   CLIPROXYMANAGER_CERTIFICATE_PASSWORD — password for the .p12
      #   SPARKLE_PRIVATE_KEY — Sparkle EdDSA private key for appcast signing
      - name: Import CLIProxyManager signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CLIPROXYMANAGER_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CLIPROXYMANAGER_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/cliproxymanager_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "CLIPROXYMANAGER_CERTIFICATE_BASE64 secret is required." >&2
            exit 1
          fi

          if [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "CLIPROXYMANAGER_CERTIFICATE_PASSWORD secret is required." >&2
            exit 1
          fi

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # The cliproxymanager certificate is self-signed, so without trust
          # settings it may not appear in `find-identity -v` in this throwaway
          # keychain. codesign can still sign by common name, so pin the identity.
          echo "Codesigning identities present in keychain:"
          security find-identity -p codesigning "$KEYCHAIN_PATH" || true
          echo "CODESIGN_IDENTITY=cliproxymanager" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and verify self-signed DMG
        run: CLIPROXYAPI_OFFLINE=1 make CODESIGN_IDENTITY="$CODESIGN_IDENTITY" verify-dmg

      - name: Sign DMG
        run: make CODESIGN_IDENTITY="$CODESIGN_IDENTITY" sign-dmg

      - name: Generate Sparkle appcast
        env:
          REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/generate-sparkle-appcast.sh

      - name: Verify release artifacts
        run: |
          scripts/verify-release-artifacts.sh \
            --source-plist Info.plist \
            --app build/CLIProxyManager.app \
            --dmg "${{ steps.version.outputs.dmg_path }}" \
            --appcast "${{ steps.version.outputs.appcast_path }}" \
            --provenance "${{ steps.version.outputs.provenance_path }}" \
            --official

      - name: Recheck published build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/check-release-monotonic.sh \
            --repository "$GITHUB_REPOSITORY" \
            --provenance "${{ steps.version.outputs.provenance_path }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release tag ${{ steps.version.outputs.tag }} appeared while artifacts were building." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to recheck release tag ${{ steps.version.outputs.tag }}." >&2
              exit "$status"
            fi
          fi

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CLIProxyManager ${{ steps.version.outputs.version }}
          body: |
            Self-signed, non-notarized DMG with Sparkle appcast.

            macOS may show a first-launch security warning because this build is signed with CLIProxyManager's own certificate rather than notarized. If that happens, open System Settings > Privacy & Security and choose Open Anyway.
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.version.outputs.dmg_path }}
            ${{ steps.version.outputs.appcast_path }}
            ${{ steps.version.outputs.provenance_path }}

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cliproxymanager_certificate.p12"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
